[project]
name = "mini-ise"
version = "0.1.0"
description = "Zero-trust network access policy service: decision engine, policy API, device simulator"
readme = "README.md"
authors = [
    { name = "Sai Praveen Tatiparthi", email = "tsaipraveen33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
mini-ise-simulator = "mini_ise.simulator:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is prose; wrapping it would change what the model reads.
"src/mini_ise/llm.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
