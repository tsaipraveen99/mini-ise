# React console behind nginx. The NodePort is mapped to localhost:8080 by the kind cluster config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: mini-ise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: mini-ise-console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: mini-ise
spec:
  type: NodePort
  selector:
    app: console
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
