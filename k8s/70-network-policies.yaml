# Zero trust inside the cluster too: nothing can talk to anything unless a policy below allows it.
#
#   browser -> console -> policy-api -> postgres <- decision-service <- simulator
#
# The decision service also gets an egress lockdown: it can reach only Postgres and DNS,
# so it cannot call an LLM or anything else on the internet even if its code tried.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mini-ise
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-from-anywhere
  namespace: mini-ise
spec:
  podSelector:
    matchLabels:
      app: console
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-api-from-console
  namespace: mini-ise
spec:
  podSelector:
    matchLabels:
      app: policy-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: console
      ports:
        - port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decision-service-from-simulator
  namespace: mini-ise
spec:
  podSelector:
    matchLabels:
      app: decision-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: simulator
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-services
  namespace: mini-ise
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["policy-api", "decision-service"]
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: decision-service-egress
  namespace: mini-ise
spec:
  podSelector:
    matchLabels:
      app: decision-service
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
