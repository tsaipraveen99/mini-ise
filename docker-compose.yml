# Local development database only. In Kubernetes, Postgres runs as its own workload.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_ise
      POSTGRES_PASSWORD: mini_ise
      POSTGRES_DB: mini_ise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_ise"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
