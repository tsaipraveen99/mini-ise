server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same job as the Vite dev proxy: /api/v1/... becomes /v1/... on the policy API Service.
    location /api/ {
        proxy_pass http://policy-api:8001/;
        # AI drafting can take several seconds.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri /index.html;
    }
}
